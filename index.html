<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio XAI · Iris</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#17263b;font:15px/1.5 system-ui,sans-serif}header{max-width:1200px;margin:auto;padding:24px 22px 14px}small{font-weight:700;letter-spacing:.12em;color:#176c83}h1{margin:5px 0;font-size:clamp(22px,3vw,32px)}p{margin:5px 0;color:#52647a}.navwrap{position:sticky;top:0;z-index:5;background:#f1f5f9;border-bottom:1px solid #dbe4ed;box-shadow:0 4px 12px #17263b09}.navinner{max-width:1200px;margin:auto;padding:10px 22px}nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}button{font:inherit;color:inherit;cursor:pointer}nav button{text-align:left;padding:10px 12px;background:white;border:1px solid #d5dee8;border-radius:9px;font-weight:600;line-height:1.3}nav button span{display:block;font-size:11px;color:#64748b;margin-bottom:5px}nav button[aria-current=true]{background:#176c83;color:white;border-color:#176c83}nav button[aria-current=true] span{color:#d5f0f4}button:focus-visible,a:focus-visible{outline:3px solid #7c3aed;outline-offset:2px}.bar{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:9px;font-size:13px}.bar a{color:#176c83;font-weight:600}.bar button{background:white;border:1px solid #d5dee8;border-radius:6px;padding:5px 10px}.bar button:disabled{opacity:.4;cursor:default}main{max-width:1200px;margin:auto;padding:14px 16px 28px}iframe{width:100%;height:800px;display:block;border:1px solid #dbe4ed;border-radius:12px;background:white}#status{font-size:12px;color:#52647a;margin:0 0 8px}@media(max-width:700px){nav{display:flex;overflow:auto;scroll-snap-type:x mandatory}nav button{min-width:145px;scroll-snap-align:start}.navinner{padding:8px 12px}header{padding:16px 12px}main{padding:10px 5px}.bar{flex-wrap:wrap}}
</style></head><body><header><small>LABORATORIO INTERACTIVO · IRIS</small><h1>Explicabilidad de modelos de clustering</h1><p>Explora cinco familias de métodos para comprender las decisiones de K-means.</p></header><div class="navwrap"><div class="navinner"><nav id="nav" aria-label="Familias de explicabilidad"></nav><div class="bar"><div><button id="prev">← Anterior</button> <button id="next">Siguiente →</button></div><span id="position" aria-live="polite"></span><a id="external" target="_blank" rel="noopener">Abrir por separado ↗</a></div></div></div><main><p id="status" role="status"></p><iframe id="content" title="Visualización de explicabilidad" loading="eager"></iframe><noscript>Activa JavaScript o abre directamente los archivos HTML.</noscript></main><script>
const pages=[['01-profiles.html','Caracterización estadística'],['02-centroids.html','Distancias a centroides'],['03-rules.html','Modelo subrogado'],['04-prototypes.html','Explicaciones por ejemplos'],['05-counterfactuals.html','Contrafactuales']];
const $=id=>document.getElementById(id), frame=$('content');let current=-1, observer=null;const buttons=pages.map(([file,title],i)=>{const b=document.createElement('button');b.innerHTML=`<span>FAMILIA 0${i+1}</span>${title}`;b.onclick=()=>select(i);$('nav').append(b);return b});
function resize(){try{const d=frame.contentDocument;if(!d||!d.body)return;const main=d.querySelector('main');const height=Math.max(main?main.getBoundingClientRect().bottom+24:0,d.body.scrollHeight,480);frame.style.height=Math.ceil(height)+'px'}catch(e){frame.style.height='80vh'}}
function select(i,update=true){if(i<0||i>=pages.length||i===current)return;current=i;if(observer)observer.disconnect();buttons.forEach((b,j)=>b.setAttribute('aria-current',String(j===i)));$('prev').disabled=i===0;$('next').disabled=i===pages.length-1;$('position').textContent=`${i+1} / ${pages.length}`;$('external').href=pages[i][0];$('status').textContent='Cargando '+pages[i][1]+'…';frame.style.height='480px';frame.title=pages[i][1];frame.src=pages[i][0];if(update)history.replaceState(null,'','#'+pages[i][0].replace('.html',''));}
frame.addEventListener('load',()=>{if(current<0)return;$('status').textContent=pages[current][1];try{const d=frame.contentDocument;if(d&&d.body){observer=new ResizeObserver(resize);observer.observe(d.body);const main=d.querySelector('main');if(main)observer.observe(main);resize();}}catch(e){frame.style.height='80vh'}});$('prev').onclick=()=>select(current-1);$('next').onclick=()=>select(current+1);window.addEventListener('resize',resize);function fromHash(){const i=pages.findIndex(p=>'#'+p[0].replace('.html','')===location.hash);select(i<0?0:i,false)}window.addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
